server:
  port: 8088

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${PAYMENT_SERVICE_DB_HOST}:${PAYMENT_SERVICE_DB_PORT}/payment
    username: ${PAYMENT_SERVICE_DB_USERNAME}
    password: ${PAYMENT_SERVICE_DB_PASSWORD}
  flyway:
    url: jdbc:postgresql://${PAYMENT_SERVICE_DB_HOST}:${PAYMENT_SERVICE_DB_PORT}/payment
    user: ${PAYMENT_SERVICE_DB_USERNAME}
    password: ${PAYMENT_SERVICE_DB_PASSWORD}

payment-service:
  fake-payment-provider:
    base-url: ${FAKE_PAYMENT_PROVIDER_URL}
    merchant-id: ${FAKE_PAYMENT_PROVIDER_MERCHANT_ID}
    merchant-password: ${FAKE_PAYMENT_PROVIDER_MERCHANT_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  observations:
    annotations:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TEMPO_URL}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
merchant:
  credentials-list:
    - username: individuals-api
      password: $2a$10$U0I9dkwii4fee6WpUu4.E.nwWV9bSewcUDB3Oazi6lOwySfuXZtke
