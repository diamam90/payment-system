server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "tempo:4317"
        http:
          endpoint: "tempo:4318"

compactor:
  compaction:
    compacted_block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks