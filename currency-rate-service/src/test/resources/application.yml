spring:
  datasource:
    url: jdbc:tc:postgresql:17:///currency
    username: test
    password: test
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_updates: true
        order_inserts: true

resilience4j:
  circuitbreaker:
    instances:
      currate:
        minimum-number-of-calls: 9
        failure-rate-threshold: 50.0
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 100.0
        sliding-window-type: time_based
        sliding-window-size: 20
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 1.5
        exponential-max-wait-duration-in-open-state: 600s
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
  retry:
    instances:
      currate:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
  ratelimiter:
    instances:
      currate:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 0s
  bulkhead:
    instances:
      currate:
        max-concurrent-calls: 3
        max-wait-duration: 0s