spring:
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: "all"
    consumer:
      group-id: "payment-system"
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        "[spring.json.value.default.type]": com.example.transactionservice.model.kafka.TransactionCompletedEvent
        "[spring.json.trusted.packages]": com.example.transactionservice.model.kafka
        "[spring.deserializer.key.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: false
  flyway:
    enabled: false

transaction-service:
  kafka:
    topic:
      out: transaction.confirm
      in: transaction.complete
  flyway:
    data-sources:
      shard1:
        url: jdbc:tc:postgresql:17:///transaction1
        username: test
        password: test
      shard2:
        url: jdbc:tc:postgresql:17:///transaction2
        username: test
        password: test
      shard3:
        url: jdbc:tc:postgresql:17:///transaction3
        username: test
        password: test