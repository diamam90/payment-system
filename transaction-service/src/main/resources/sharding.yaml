mode:
  type: Standalone
  repository:
    type: JDBC

dataSources:
  shard0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://$${TRANSACTION_SERVICE_SHARD_1_HOST::localhost}:$${TRANSACTION_SERVICE_SHARD_1_PORT::5435}/transaction
    username: $${TRANSACTION_SERVICE_SHARD_1_USERNAME::transactionadmin}
    password: $${TRANSACTION_SERVICE_SHARD_1_PASSWORD::transactionadmin}
  shard1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://$${TRANSACTION_SERVICE_SHARD_2_HOST::localhost}:$${TRANSACTION_SERVICE_SHARD_2_PORT::5436}/transaction
    username: $${TRANSACTION_SERVICE_SHARD_2_USERNAME::transactionadmin}
    password: $${TRANSACTION_SERVICE_SHARD_2_PASSWORD::transactionadmin}
  shard2:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: jdbc:postgresql://$${TRANSACTION_SERVICE_SHARD_3_HOST::localhost}:$${TRANSACTION_SERVICE_SHARD_3_PORT::5437}/transaction
    username: $${TRANSACTION_SERVICE_SHARD_3_USERNAME::transactionadmin}
    password: $${TRANSACTION_SERVICE_SHARD_3_PASSWORD::transactionadmin}

rules:
  - !SHARDING
    tables:
      transactions:
        actualDataNodes: shard${0..2}.transactions
      wallets:
        actualDataNodes: shard${0..2}.wallets
    defaultShardingColumn: user_uid
    bindingTables:
      - transactions,wallets
    defaultDatabaseStrategy:
      standard:
        shardingColumn: user_uid
        shardingAlgorithmName: user_inline
    shardingAlgorithms:
      user_inline:
        type: INLINE
        props:
          algorithm-expression: shard${ Math.abs(UUID.fromString((String)user_uid).hashCode() % 3)}

  - !BROADCAST
    tables:
      - wallet_types

props:
  sql-show: false